name: desktop-release

# Builds the macOS app and drafts a GitHub release with the .dmg, the updater feed (latest.json)
# and the archive scripts/install-desktop.sh installs. Push a tag that matches the app version,
# e.g. `git tag v0.1.0`. With the Apple secrets set, the app is signed with your Developer ID and
# notarized; without them it is ad-hoc signed, and users open it once with "Open Anyway".
# The release stays a draft until you publish it, and installed apps only see an update once
# it is published, so test the draft's .dmg first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # The updater only installs a higher version, and a placeholder key would ship an app that
      # can never verify an update. Both mistakes are cheap here and permanent once released.
      - name: Check the tag and updater key
        run: |
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"; exit 1; }
          if grep -q REPLACE_WITH desktop/src-tauri/tauri.conf.json; then echo "Set plugins.updater.pubkey in tauri.conf.json"; exit 1; fi

      - run: bun install --frozen-lockfile
      - run: npm ci
        working-directory: web
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run web && bun run backend --universal
        working-directory: desktop

      # Tauri treats a variable that is set as present, so an unset secret (an empty string here)
      # would make it import an empty certificate and fail. Export only the ones that exist.
      - name: Choose how to sign
        env:
          # Developer ID Application certificate, exported from Keychain Access as .p12, base64-encoded.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization: your Apple ID, an app-specific password from account.apple.com, and team ID.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
            done
            echo "Signing with the Developer ID certificate."
          else
            # "-" is an ad-hoc signature: no certificate, but every file in the bundle is sealed.
            # An unsigned bundle shows "Caramel is damaged" on Apple Silicon, which users cannot open.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No Apple certificate: ad-hoc signing, no notarization."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update itself, from `bun run tauri signer generate`. Different from the Apple certificate.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: bun run tauri
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Caramel ${{ github.ref_name }}
          releaseBody: |
            **Install from Terminal** (no security prompt):

            ```sh
            curl -fsSL https://raw.githubusercontent.com/KatalKavya96/CaramelAI/main/scripts/install-desktop.sh | sh
            ```

            **Or download the .dmg** below and drag Caramel to Applications. Caramel is not notarized by
            Apple, so the first launch is blocked: open it once, then go to System Settings → Privacy &
            Security, click **Open Anyway** next to the Caramel message, and confirm. Later launches and
            updates open normally.

            Caramel needs `git`. If macOS offers to install the command line developer tools, accept.
          releaseDraft: true
