name: desktop-check

# Builds the macOS app the way desktop-release.yml does, on every PR that can change it, so a
# signing or bundling problem turns the PR red instead of failing a release. Ad-hoc signed and
# without updater artifacts, so it needs no secrets and publishes nothing.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "src/server/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop-*.yml"

permissions:
  contents: read

jobs:
  macos-build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: plutil -lint desktop/src-tauri/Entitlements.plist
      - run: bun install --frozen-lockfile
      - run: npm ci
        working-directory: web
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run web && bun run backend --universal
        working-directory: desktop
      - run: bun run tauri build --target universal-apple-darwin --bundles app
        working-directory: desktop

      # The signature has to hold for the whole bundle, and the backend has to start under the
      # hardened runtime: that is where a missing JIT entitlement would kill it.
      - name: Check the signed app starts
        run: |
          app=desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Caramel.app
          backend="$app/Contents/MacOS/caramel-backend"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - --xml "$backend" | grep -q allow-jit
          lipo -archs "$backend" | grep -q arm64
          lipo -archs "$backend" | grep -q x86_64
          CARAMEL_DATA_DIR="$RUNNER_TEMP/caramel" "$backend" --no-open > "$RUNNER_TEMP/backend.log" 2>&1 &
          pid=$!
          for _ in $(seq 30); do
            if grep -q CARAMEL_READY "$RUNNER_TEMP/backend.log"; then break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/backend.log"
          grep -q CARAMEL_READY "$RUNNER_TEMP/backend.log"
