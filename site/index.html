<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Caramel is a coding agent that fixes issues in a sandboxed copy of your repo, runs your project's own checks, and only says verified when the evidence does." />
    <link rel="icon" type="image/svg+xml" href="/caramel.svg" />
    <title>Caramel: agents that show their work</title>
    <script>
      // Fresh openings start light. A refresh alone preserves this tab's theme choice.
      try {
        var navigation = performance.getEntriesByType("navigation")[0];
        var refreshing = navigation && navigation.type === "reload";
        var saved = refreshing ? sessionStorage.getItem("caramel-site-theme") : null;
        var theme = saved === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        sessionStorage.setItem("caramel-site-theme", theme);
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
